name: Atlas
options:
  bundleIdPrefix: com.hggdet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    revision: 13e41ab3d77ff5113e7e5d4ee87803b1f81f5683
targets:
  Atlas:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: MapLibre
        product: MapLibre
      - target: AtlasWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: اطلس
        CFBundleName: Atlas
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: يحتاج اطلس إلى موقعك لعرضه على الخريطة وحساب المسارات.
        NSLocationAlwaysAndWhenInUseUsageDescription: يحتاج اطلس إلى موقعك في الخلفية لإرشاد الملاحة وتنبيهات القرب.
        CFBundleURLTypes:
          - CFBundleURLName: com.hggdet.atlas
            CFBundleURLSchemes:
              - atlas
    entitlements:
      path: App/Atlas.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hggdet.atlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hggdet.atlas
        PRODUCT_NAME: Atlas
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
    preBuildScripts:
      - name: Decode App Icon
        script: |
          B64="$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png.b64"
          OUT="$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          if [ -f "$B64" ]; then base64 -D -i "$B64" -o "$OUT" 2>/dev/null || base64 --decode "$B64" > "$OUT"; fi
  AtlasWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: اطلس سريع
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hggdet.atlas.widget
        PRODUCT_NAME: AtlasWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/AtlasWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hggdet.atlas
schemes:
  Atlas:
    build:
      targets:
        Atlas: all
    run:
      config: Debug
    archive:
      config: Release
